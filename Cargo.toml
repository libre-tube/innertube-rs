[package]
name = "innertube"
version = "0.1.0"
authors = ["unixource <unixource@tuta.io>"]
edition = "2024"
description = "Channel & video metadata parsing library from YouTube"
license = "MIT"

[dependencies]
eyre = "0.6.14"
isahc = { version = "2.0.2", features = ["cookies"] }
log = "0.4.34"
pretty_env_logger = "0.5.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_with = "3.24.0"
