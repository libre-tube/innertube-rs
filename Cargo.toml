[package]
name = "innertube"
version = "0.1.0"
authors = ["unixource <unixource@tuta.io>"]
edition = "2024"
description = "Channel & video metadata parsing library from YouTube"
license = "MIT"

[dependencies]
isahc = { version = "2.0.2", features = ["cookies"] }
itertools = "0.15.0"
log = "0.4.34"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_with = "3.24.0"
thiserror = "2.0.21"

[dev-dependencies]
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread"] }
